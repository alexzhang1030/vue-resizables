name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      npm_config_dangerously_allow_all_builds: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Enable pnpm
        run: npm i -g --force corepack && corepack enable
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Setup ni
        run: npm i -g @antfu/ni
      - name: Install
        run: nci
      - name: Lint
        run: nr lint
      - name: Build
        run: nr build
